name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is no longer preinstalled on the newest Ubuntu image.
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python run_tests.py
      - name: CLI smoke test
        run: |
          PYTHONPATH=src python -m cronpulse check "0 9 * * 1-5" --after 2026-01-01T00:00
          PYTHONPATH=src python -m cronpulse next "*/15 * * * *" -n 2

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cronpulse --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
